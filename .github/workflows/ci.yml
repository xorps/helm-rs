name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Go version the official Helm v4.3.0 binary was built with.
  GO_VERSION: "1.27.1"

jobs:
  lint:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (2026-10-09)
        with:
          # Pinned so new lints in a future stable release don't break CI
          # unannounced; bump deliberately.
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo fmt --check
        working-directory: fuzz
      - run: cargo clippy --all-targets --release -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  no-std:
    name: no_std (bare metal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (2026-10-09)
        with:
          toolchain: stable
          targets: aarch64-unknown-none, thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --lib --release --target aarch64-unknown-none
      - run: cargo build --lib --release --target aarch64-unknown-none --no-default-features
      - run: cargo build --lib --release --target thumbv7em-none-eabihf --no-default-features

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (2026-10-09)
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --lib --all-features

  test:
    name: test vs Helm v4.3.0
    runs-on: ubuntu-latest
    env:
      # Missing oracle, helm binary or charts is a failure here, not a skip.
      HELM_ORACLE_REQUIRED: "1"
      HELM_RS_CHARTS_REQUIRED: "1"
      # Reproducible fuzzing: rerun locally with the same seed.
      HELM_RS_FUZZ_SEED: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (2026-10-09)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: oracle/go.sum
      - name: Build the Go oracle (Helm v4.3.0 as a library)
        run: scripts/build-oracle.sh
      - name: Fetch the official helm v4.3.0 binary (sha256-verified)
        run: scripts/fetch-helm.sh
      - name: Cache the chart corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: testdata/charts/cache
          key: charts-${{ hashFiles('testdata/charts/charts.lock') }}
      - name: Fetch the chart corpus (sha256-verified)
        run: scripts/fetch-charts.sh
      - name: Test
        run: |
          echo "fuzz seed: $HELM_RS_FUZZ_SEED (reproduce with HELM_RS_FUZZ_SEED=$HELM_RS_FUZZ_SEED)"
          cargo test --release --no-fail-fast
