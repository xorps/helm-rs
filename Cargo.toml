[package]
name = "helm-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "no_std SDK for rendering Helm charts (Go text/template + Sprig + Helm functions), diff-tested against real Helm"
license = "Apache-2.0"
repository = "https://github.com/xorps/helm-rs"
exclude = ["oracle/", "fuzz/", "testdata/charts/"]

[lib]
name = "helm_rs"

[features]
default = ["archive"]
# Load charts from .tgz archives (gzip + tar), pure Rust, no_std.
archive = ["dep:miniz_oxide"]

[dependencies]
aes = { version = "0.8", default-features = false }
blowfish = { version = "0.9", default-features = false, features = ["bcrypt"] }
hmac = { version = "0.12", default-features = false }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"], optional = true }
regex-automata = { version = "0.4", default-features = false, features = ["alloc", "syntax", "meta", "nfa", "hybrid", "dfa-onepass", "unicode"] }
regex-syntax = { version = "0.8", default-features = false, features = ["unicode"] }
scrypt = { version = "0.11", default-features = false }
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
serde_json = "1"

[profile.test]
opt-level = 1
